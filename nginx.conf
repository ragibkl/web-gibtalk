server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the ingress, absolute redirects would point at port 8080.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # The old site's symbol search, which teachers may have bookmarked.
    location ~ ^/images/search/?$ {
        return 301 /symbols/;
    }

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}

# The site's earlier addresses redirect to gibtalk.com, keeping the path, so
# links like /privacy/ and /symbols/#credits (built into the app) still work.
map $host $gibtalk_old_host {
    default           0;
    gibtalk.ragib.dev 1;
    gibtalk.ragib.my  1;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the ingress, absolute redirects would point at port 8080.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    if ($gibtalk_old_host) {
        return 301 https://gibtalk.com$request_uri;
    }

    # Pages: browsers keep a copy but check for a newer one on every visit
    # (a cheap 304 when unchanged), so a deploy shows up straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # The old site's symbol search, which teachers may have bookmarked.
    location ~ ^/images/search/?$ {
        return 301 /symbols/;
    }

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
